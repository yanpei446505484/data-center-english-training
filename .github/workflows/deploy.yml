name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - name: Cache Kokoro model archive
        uses: actions/cache@v4
        with:
          path: .cache/kokoro-multi-lang-v1_0.tar.bz2
          key: kokoro-multi-lang-v1-0
      - run: npm ci
      - name: Install Kokoro runtime
        run: python3 -m pip install -r scripts/requirements-audio.txt
      - name: Download and extract Kokoro model
        run: |
          mkdir -p .cache "$RUNNER_TEMP/kokoro-model"
          if [ ! -f .cache/kokoro-multi-lang-v1_0.tar.bz2 ]; then
            curl -L --fail --retry 3 -o .cache/kokoro-multi-lang-v1_0.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2
          fi
          tar --no-same-owner -xjf .cache/kokoro-multi-lang-v1_0.tar.bz2 -C "$RUNNER_TEMP/kokoro-model"
      - name: Generate all static pronunciation audio
        env:
          KOKORO_MODEL_DIR: ${{ runner.temp }}/kokoro-model/kokoro-multi-lang-v1_0
        run: npm run prepare:audio
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
