name: Bootstrap full replica and deploy

on:
  push:
    branches: [bootstrap-v2]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out bootstrap package
        uses: actions/checkout@v4

      - name: Restore full source archive
        shell: bash
        run: |
          cat source-parts/full-replica-source.tar.gz.part-* > /tmp/full-replica-source.tar.gz
          echo "2aa87265cf37cca8c9e5eb010aa25c6d02349e7d5eabf124849242c6e967e440  /tmp/full-replica-source.tar.gz" | sha256sum --check
          git fetch origin main
          git checkout -B publish-v2 origin/main
          git rm -r --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/full-replica-source.tar.gz

      - name: Publish full source to main and backup branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete Miaoda replica with reliable offline audio"
          git push origin HEAD:refs/heads/full-replica-v2 --force
          git push origin HEAD:main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
